[project]
name = "smart-agent"
version = "0.1.0"
description = "SmartAgent — Adaptive Cognitive Engine by MekongAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.10",
    "google-genai>=2.4.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_agent"]

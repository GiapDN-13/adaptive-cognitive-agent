[project]
name = "smartagent-v2"
version = "0.1.0"
description = "SmartAgent V2 — AI agent with Docker sandbox execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "docker>=7.0",
    "boto3>=1.43",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "python-multipart>=0.0.9",
    "duckduckgo-search>=8.1",
    "httpx>=0.28",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

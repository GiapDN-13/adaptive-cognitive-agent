services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-cursor}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Passed through for temporary/STS credentials (access keys starting with ASIA).
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=us-east-1
      - BEDROCK_LIGHT_MODEL=${BEDROCK_LIGHT_MODEL:-us.anthropic.claude-sonnet-4-6-v1}
      - BEDROCK_HEAVY_MODEL=${BEDROCK_HEAVY_MODEL:-us.anthropic.claude-opus-4-6-v1}
      # Secrets come from v2/.env (gitignored) — never hardcode a default here.
      - CURSOR_API_KEY=${CURSOR_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - SANDBOX_IMAGE=smartagent-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/app:/app/app
      - ./backend/vendor:/app/vendor
      # Mount host AWS credentials LIVE (read-only). When the STS token expires,
      # paste a fresh one into the host ~/.aws/credentials; the backend reads it
      # on the next call (after Continue) — no recreate, no lost context.
      # Override AWS_CRED_DIR in v2/.env if your ~/.aws lives elsewhere.
      - ${AWS_CRED_DIR:-/c/Users/OS/.aws}:/root/.aws:ro
    depends_on:
      sandbox-build:
        condition: service_completed_successfully
  cursor-proxy:
    build:
      context: ./backend/cursor_proxy
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Secret from v2/.env (gitignored) — no hardcoded default.
      - CURSOR_API_KEY=${CURSOR_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  sandbox-build:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox:/sandbox
    command: docker build -t smartagent-sandbox:latest -f /sandbox/Dockerfile.sandbox /sandbox
